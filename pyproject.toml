[project]
name = "tfbash-mcp"
version = "0.2.0"
description = "A cross-platform persistent Shell MCP server for agent systems"
readme = "README.md"
authors = [{ name = "A2C-SMCP" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "jsonschema>=4.25.0,<5.0.0",
    "mcp>=1.29.0,<2.0.0",
    "pexpect>=4.9.0,<5.0.0",
    "pywinpty==3.0.5; sys_platform == 'win32'",
    "pydantic>=2.13.0,<2.14.0",
]

[project.scripts]
tfbash-mcp = "tfbash_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfbash_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src/tfbash_mcp"]

[dependency-groups]
windows-lab = [
    "pexpect>=4.9.0,<5.0.0",
]
dev = [
    "mypy>=1.17.1,<1.18.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "ruff>=0.12.9,<0.13.0",
    "types-jsonschema>=4.25.0,<5.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tfbash_mcp"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
