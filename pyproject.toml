[project]
name = "tfbash-mcp"
version = "0.1.0"
description = "A general-purpose Bash MCP server for agent systems"
readme = "README.md"
authors = [{ name = "A2C-SMCP" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp>=1.29.0,<2.0.0",
    "pexpect>=4.9.0,<5.0.0",
]

[project.scripts]
tfbash-mcp = "tfbash_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.17.1,<1.18.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "ruff>=0.12.9,<0.13.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tfbash_mcp"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
